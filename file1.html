<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I'm Sorry 🥺</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    overflow: hidden;
    font-family: 'Segoe UI', 'Helvetica Neue', sans-serif;
    background: radial-gradient(circle at 50% 40%, #1a1a2e 0%, #0f0f1e 60%, #05050a 100%);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    user-select: none;
  }

  .stage {
    max-width: 620px;
    padding: 40px 30px;
    position: relative;
    z-index: 2;
  }

  h1 {
    font-size: 2.4rem;
    font-weight: 300;
    letter-spacing: 1px;
    margin-bottom: 20px;
    line-height: 1.4;
    opacity: 0;
    animation: fadeIn 1s ease 0.3s forwards;
  }

  h1 .emoji {
    font-size: 2.8rem;
    display: inline-block;
    animation: wobble 2.5s ease-in-out infinite;
    transition: transform 0.25s ease;
  }

  h1 .emoji.pop {
    animation: pop 0.35s ease;
  }

  @keyframes wobble {
    0%, 100% { transform: rotate(-6deg); }
    50%      { transform: rotate(6deg); }
  }
  @keyframes pop {
    0%   { transform: scale(1)    rotate(0deg); }
    40%  { transform: scale(1.35) rotate(10deg); }
    100% { transform: scale(1)    rotate(0deg); }
  }

  .sub {
    font-size: 1.1rem;
    color: #b8b8d8;
    margin-bottom: 50px;
    line-height: 1.7;
    opacity: 0;
    animation: fadeIn 1s ease 0.6s forwards;
  }

  #runner {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    padding: 18px 44px;
    font-size: 1.15rem;
    font-weight: 500;
    letter-spacing: 1px;
    color: #fff;
    background: linear-gradient(135deg, #6a5acd, #8a7cf0);
    border: none;
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 8px 30px rgba(106, 90, 205, 0.5);
    transition: top 0.28s cubic-bezier(0.34, 1.56, 0.64, 1),
                left 0.28s cubic-bezier(0.34, 1.56, 0.64, 1),
                background 0.4s ease,
                box-shadow 0.4s ease,
                transform 0.2s ease;
    z-index: 10;
    opacity: 0;
    animation: fadeIn 1s ease 0.9s forwards;
  }

  #runner.tired {
    background: linear-gradient(135deg, #ff4d8d, #ff8a5b);
    box-shadow: 0 8px 30px rgba(255, 77, 141, 0.5);
    cursor: pointer;
  }

  #runner.tired:hover {
    transform: translate(-50%, -50%) scale(1.06);
  }

  #taunt {
    position: fixed;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 1rem;
    color: #8a8aac;
    font-style: italic;
    opacity: 0;
    transition: opacity 0.4s ease;
    z-index: 5;
    text-align: center;
    max-width: 90vw;
  }
  #taunt.show { opacity: 1; }

  #final {
    display: none;
    opacity: 0;
    animation: fadeIn 1s ease forwards;
  }
  #final h1 {
    font-size: 2rem;
    animation: none;
    opacity: 1;
  }
  #final .heart {
    font-size: 3rem;
    display: block;
    margin: 20px 0;
    animation: pulse 1.8s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.15); }
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

  <div class="stage">
    <div id="intro">
      <h1>I'm sorry... <span class="emoji" id="emoji">🥹</span></h1>
      <p class="sub">Press the button below to see the next part.</p>
    </div>

    <div id="final">
      <h1>...fine, you win.</h1>
      <span class="heart">💜</span>
      <p class="sub">You always do. Okay, come with me — there's more.</p>
      <button id="nextBtn" style="
        padding: 16px 40px;
        font-size: 1.1rem;
        color: #fff;
        background: linear-gradient(135deg, #ff4d8d, #ff8a5b);
        border: none;
        border-radius: 50px;
        cursor: pointer;
        box-shadow: 0 8px 30px rgba(255, 77, 141, 0.5);
        margin-top: 20px;
        transition: transform 0.2s ease;
      ">Next →</button>
    </div>
  </div>

  <button id="runner">Forgive Me</button>

  <div id="taunt"></div>

<script>
  const runner  = document.getElementById('runner');
  const taunt   = document.getElementById('taunt');
  const intro   = document.getElementById('intro');
  const finalEl = document.getElementById('final');
  const emojiEl = document.getElementById('emoji');

  const EMOJIS = ['🥹', '😅', '🥱', '🙂', '🫂'];
  let emojiIndex = 0;

  function cycleEmoji() {
    emojiIndex = (emojiIndex + 1) % EMOJIS.length;
    emojiEl.textContent = EMOJIS[emojiIndex];
    emojiEl.classList.remove('pop');
    void emojiEl.offsetWidth;
    emojiEl.classList.add('pop');
  }

  let dodgeCount = 0;
  const MAX_DODGES = 5;
  let tired = false;

  const taunts = [
    "hehe, too slow 😏",
    "almost! try again",
    "you're really trying 🥺",
    "okay okay, one more...",
    "fine... you win 💜"
  ];

  function dodge() {
    if (tired) return;

    dodgeCount++;

    const btnW = runner.offsetWidth;
    const btnH = runner.offsetHeight;
    const pad  = 40;
    const maxX = window.innerWidth  - btnW - pad;
    const maxY = window.innerHeight - btnH - pad;

    const x = pad + Math.random() * (maxX - pad);
    const y = pad + Math.random() * (maxY - pad);

    runner.style.left = x + 'px';
    runner.style.top  = y + 'px';

    taunt.textContent = taunts[Math.min(dodgeCount - 1, taunts.length - 1)];
    taunt.classList.add('show');

    if (dodgeCount >= MAX_DODGES) {
      setTimeout(() => {
        tired = true;
        runner.classList.add('tired');
        runner.textContent = 'Okay... Forgive Me 💜';

        runner.style.left = '50%';
        runner.style.top  = '50%';

        taunt.textContent = 'fine... you win 💜';
      }, 400);
    }
  }

  runner.addEventListener('mouseenter', () => {
    cycleEmoji();
    dodge();
  });

  runner.addEventListener('touchstart', (e) => {
    if (!tired) {
      e.preventDefault();
      cycleEmoji();
      dodge();
    }
  }, { passive: false });

  runner.addEventListener('click', () => {
    if (!tired) {
      cycleEmoji();
      dodge();
      return;
    }

    intro.style.display = 'none';
    runner.style.display = 'none';
    taunt.classList.remove('show');
    finalEl.style.display = 'block';
  });

  // ── Next → go to file2.html ──
  document.getElementById('nextBtn').addEventListener('click', () => {
    window.location.href = 'file2.html';
  });

  window.addEventListener('resize', () => {
    if (!tired && runner.style.left && runner.style.left !== '50%') {
      const btnW = runner.offsetWidth;
      const btnH = runner.offsetHeight;
      const x = Math.min(parseFloat(runner.style.left), window.innerWidth - btnW - 40);
      const y = Math.min(parseFloat(runner.style.top),  window.innerHeight - btnH - 40);
      runner.style.left = Math.max(40, x) + 'px';
      runner.style.top  = Math.max(40, y) + 'px';
    }
  });
</script>
</body>
</html>
